    <script>
      // SPA redirect decoder — pairs with public/404.html.
      // Converts /?/path/here back into /path/here via history.replaceState
      // so React Router sees the original URL on hard reload / direct link.
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
